name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tool-description-lint:
    name: Tool description exclusivity lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/lint-tool-descriptions.py --self-test
      - run: python3 scripts/lint-tool-descriptions.py

  python:
    name: Python notebook skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Python tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s notebook_common/tests
          for test_dir in mofa-notebook-*/tests scripts/tests; do
            python3 -m unittest discover -s "$test_dir"
          done

  rust:
    name: Rust (check + clippy + test)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: mofa-cli
          - os: ubuntu-latest
            package: mofa-podcast
          - os: ubuntu-latest
            package: mofa-fm
          - os: ubuntu-latest
            package: mofa-site
          - os: ubuntu-latest
            package: mofa-publish
          - os: windows-latest
            package: mofa-cli
          - os: windows-latest
            package: mofa-fm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.package }}
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  sync-registry:
    name: Sync skill registry
    needs: rust
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate registry.json
        run: python3 scripts/gen-registry.py --write

      - name: Push to octos-hub
        env:
          REGISTRY_TOKEN: ${{ secrets.OCTOS_HUB_TOKEN }}
        run: |
          set -e
          REGISTRY_REPO="octos-org/octos-hub"
          BRANCH="main"
          FILE="registry.json"

          # Read generated registry
          CONTENT=$(base64 -w0 registry.json)

          # Get current file SHA (needed for update)
          SHA=$(curl -sf \
            -H "Authorization: token $REGISTRY_TOKEN" \
            "https://api.github.com/repos/$REGISTRY_REPO/contents/$FILE?ref=$BRANCH" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")

          # Check if content changed
          REMOTE_CONTENT=$(curl -sf \
            -H "Authorization: token $REGISTRY_TOKEN" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/$REGISTRY_REPO/contents/$FILE?ref=$BRANCH" 2>/dev/null || echo "")

          LOCAL_CONTENT=$(cat registry.json)

          if [ "$REMOTE_CONTENT" = "$LOCAL_CONTENT" ]; then
            echo "Registry is up to date, skipping."
            exit 0
          fi

          # Build update payload
          MSG="chore: auto-sync from mofa-skills@${GITHUB_SHA::7}"
          PAYLOAD=$(python3 -c "
          import json, sys
          print(json.dumps({
            'message': '$MSG',
            'content': '$CONTENT',
            'sha': '$SHA',
            'branch': '$BRANCH'
          }))
          ")

          # Push update
          curl -sf -X PUT \
            -H "Authorization: token $REGISTRY_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REGISTRY_REPO/contents/$FILE" \
            -d "$PAYLOAD"

          echo "Registry updated successfully."
